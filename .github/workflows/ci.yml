  #     - name: Install k6
  #       run: |
  #         curl -sSL -o /tmp/k6.deb \
  #           https://github.com/grafana/k6/releases/download/v0.57.0/k6-v0.57.0-linux-amd64.deb
  #         sudo dpkg -i /tmp/k6.deb
  #     - name: Nightly gate (scripts/ci.sh stage 16)
  #       env:
  #         NIGHTLY: "1"
  #         HRM_K6_BASE_URL: ${{ secrets.HRM_K6_BASE_URL }}
  #         HRM_K6_EMAIL: ${{ secrets.HRM_K6_EMAIL }}
  #         HRM_K6_PASSWORD: ${{ secrets.HRM_K6_PASSWORD }}
  #       run: bash scripts/ci.sh

  # ---- FIN-035 (Phase 3) nightly e2e lane (template) -----------------------
  # The default push gate keeps its E2E_SKIP affordance; the NIGHTLY lane
  # REFUSES to skip (a skipped gate was the original OPS-4 finding). It runs
  # the full e2e suite — HTTP journeys + the whole Playwright tests/e2e-ui
  # directory (including the FIN-030 desktop two-company switch smoke) —
  # against the STANDALONE PRODUCTION build, on a runner with a PostgreSQL
  # service (see the gate job for the service template). Triggered by the
  # 01:20 Asia/Dhaka cron entry above.
