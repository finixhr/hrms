# /etc/logrotate.d/hrm — log rotation for the HRM Next.js server
# OPS-R9 (this audit) — prevents unbounded stdout/stderr accumulation.
# Place at /etc/logrotate.d/hrm on the production host.

/opt/hrm/logs/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0640 hrm hrm
    sharedscripts
    postrotate
        /bin/systemctl reload hrm.service 2>/dev/null || true
    endscript
}

# Capture stdout/stderr from systemd if journald is not in use
/var/log/hrm/*.log {
    weekly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    create 0640 hrm hrm
}
