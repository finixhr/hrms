;; ============ PgBouncer — production connection pooling (Wave 11 §3) ============
;; Deployed natively next to PostgreSQL on the DB host (production) or via the
;; `pooling` profile in docker-compose.yml (staging). The app's DATABASE_URL
;; then points at PgBouncer (:6432) instead of PostgreSQL (:5432):
;;
;;   DATABASE_URL="postgresql://hrm:PASS@127.0.0.1:6432/hrm?pgbouncer=true&connection_limit=4"
;;
;; The `pgbouncer=true` Prisma parameter disables prepared-statement caching
;; semantics that transaction-mode pooling cannot honor. Keep server-side
;; prepared statements OFF for the pooled path; direct :5432 admin sessions
;; (migrations, psql, pg_dump) are unaffected.
;;
;; Sizing math (docs/SCALING.md §5): app instances × connection_limit must stay
;; BELOW the Postgres max_connections after reserving headroom for migrations
;; + ops sessions. With 4 app instances × 4 pooled conns + default_max_user_
;; connections below, the DB sees ~20 server connections regardless of how
;; many APP processes exist.

[databases]
;; route to the real postgres; %include the same name from userlist.txt
hrm = host=127.0.0.1 port=5432 dbname=hrm

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; pool sizing — total server connections cap for ALL instances
default_pool_size = 20
max_client_conn = 400
max_user_connections = 40

;; transaction pooling: the app's statements are short; idle app connections
;; do not hold a server backend hostage between requests
pool_mode = transaction

;; Prisma compatibility
ignore_startup_parameters = extra_float_digits
server_reset_query = DISCARD ALL

;; robustness
server_idle_timeout = 300
server_lifetime = 3600
query_wait_timeout = 15
client_idle_timeout = 600
;; PostgreSQL 17 default: dedicated prepared statements are not reused across
;; pooled server connections
max_prepared_statements = 0

;; observability — scrape with Prometheus pgbouncer_exporter
stats_period = 60
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
